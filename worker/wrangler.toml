name = "tnsaints"
main = "src/index.js"
compatibility_date = "2026-08-08"

# Attach the API hostname declaratively rather than through the dashboard, so
# the binding is version-controlled and survives the Worker being recreated.
# custom_domain = true means the Worker IS the origin (a plain route would
# expect a separate origin server behind it). Cloudflare creates the DNS record
# and provisions the certificate on deploy, because it already runs this zone.
routes = [
  { pattern = "api.tnsaints.com", custom_domain = true }
]

# One canonical hostname. Declaring these explicitly rather than letting the
# custom domain disable them implicitly, so nobody is surprised later.
# workers.dev subdomains are also blocked on some school and corporate
# networks, which is the last thing a parent registration form needs.
workers_dev = false
preview_urls = false

# ---------------------------------------------------------------------------
# Non-secret configuration. Everything that decides who gets a spot lives here
# rather than in the browser, so a visitor cannot edit their way past a limit.
# ---------------------------------------------------------------------------
[vars]
EVENT_ID = "2026-08-29-evaluation"
EVENT_LABEL = "Free Academy Evaluation - Saturday, August 29, 2026"

# 25 per session, two sessions = 50 total.
SLOT_CAPACITY = "25"
SESSION_TIMES = "9:00 AM,10:00 AM"

# Explicit -05:00 offset = Central Daylight Time. The cutoff is the same
# instant for every visitor regardless of their device timezone or clock.
REGISTRATION_CLOSES_AT = "2026-08-22T23:59:59-05:00"

ALLOWED_ORIGINS = "https://tnsaints.com,https://www.tnsaints.com"

# Email notifications (Resend). Sending happens after the spot is committed,
# so an email outage never costs anyone their registration.
NOTIFY_EMAIL_TO = "info@tnsaints.com"
# Sends from a subdomain, not the root. Two reasons: it keeps automated
# sending reputation away from the Microsoft 365 mail on tnsaints.com, and it
# stops the academy alert from looking like same-domain spoofing to M365 (the
# alert is addressed to info@tnsaints.com). Recipients see "Tennessee Saints"
# as the sender name, and replies route to NOTIFY_EMAIL_TO.
NOTIFY_EMAIL_FROM = "Tennessee Saints <noreply@mail.tnsaints.com>"
SEND_PARENT_CONFIRMATION = "true"

# Resend free plan sends at most 100 emails/day. Two per registration means a
# full 50-seat day sits exactly on the ceiling, so the Worker meters its own
# spend. Alerts may use the whole budget; parent receipts stop once fewer than
# EMAIL_ALERT_RESERVE credits remain, keeping headroom for a late rush.
# Raise EMAIL_DAILY_LIMIT if the Resend plan is upgraded.
EMAIL_DAILY_LIMIT = "100"
EMAIL_ALERT_RESERVE = "25"

# Set to "false" only for local testing without Turnstile keys.
TURNSTILE_ENABLED = "true"

# Max registrations accepted from one IP hash within RATE_LIMIT_WINDOW_MINUTES.
RATE_LIMIT_MAX = "3"
RATE_LIMIT_WINDOW_MINUTES = "10"

[[d1_databases]]
binding = "DB"
database_name = "tnsaints"
# Filled in by `npm run db:create` — see README step 2.
database_id = "8f449ac8-d165-4db1-b267-b10e6d55d9b0"

[observability]
enabled = true
# Full sampling: this Worker handles a few hundred requests across the whole
# campaign, so there is no volume worth trading away, and a missing trace on
# the one failed registration is exactly the trace we would want.
head_sampling_rate = 1

# ---------------------------------------------------------------------------
# Static site hosting. Left commented until the changeover so this Worker can
# be deployed and tested as an API while GitHub Pages still serves tnsaints.com.
# See README "Phase 2" for the cutover.
# ---------------------------------------------------------------------------
# [assets]
# directory = "../public"
# not_found_handling = "404-page"

# ---------------------------------------------------------------------------
# Secrets — never in this file. Set with:
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put IP_HASH_SALT
#   wrangler secret put RESEND_API_KEY
# Locally they come from .dev.vars (gitignored).
# ---------------------------------------------------------------------------
